<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive GitHub Page</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        button {
            cursor: pointer;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            background-color: var(--accent-color);
            color: white;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .theme-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--text-color);
        }

        .dashboard {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin-bottom: 1rem;
            font-size: 1.25rem;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 0.5rem;
        }

        /* Click Counter Styling */
        .counter-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .counter-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 1rem 0;
            color: var(--accent-color);
        }

        /* Todo List Styling */
        .todo-input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.6rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .todo-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            background: var(--bg-color);
            margin-bottom: 0.5rem;
            border-radius: 6px;
        }

        .delete-btn {
            background-color: var(--danger-color);
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
        }
        
        .delete-btn:hover {
            background-color: #b91c1c;
        }

        /* Canvas Animation Styling */
        .canvas-card {
            grid-column: span 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (max-width: 600px) {
            .canvas-card {
                grid-column: span 1;
            }
        }

        canvas {
            background: #000;
            border-radius: 8px;
            width: 100%;
            height: 200px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Interactive Space</h1>
        <button class="theme-btn" id="themeToggle">Toggle Theme</button>
    </header>

    <div class="dashboard">
        <!-- Card 1: Click Counter -->
        <div class="card counter-section">
            <h2>Click Counter</h2>
            <div class="counter-display" id="counter">0</div>
            <button id="countBtn">Click Me!</button>
        </div>

        <!-- Card 2: To-Do List -->
        <div class="card">
            <h2>Task Tracker</h2>
            <div class="todo-input-group">
                <input type="text" id="todoInput" placeholder="Add a new task...">
                <button id="addTodoBtn">Add</button>
            </div>
            <ul class="todo-list" id="todoList"></ul>
        </div>

        <!-- Card 3: Interactive Particle Canvas -->
        <div class="card canvas-card">
            <h2>Interactive Particle Box (Move mouse inside)</h2>
            <canvas id="particleCanvas"></canvas>
        </div>
    </div>

    <script>
        // --- Theme Switcher Logic ---
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        });

        // --- Click Counter Logic ---
        const counterDisplay = document.getElementById('counter');
        const countBtn = document.getElementById('countBtn');
        let count = 0;
        
        countBtn.addEventListener('click', () => {
            count++;
            counterDisplay.textContent = count;
            // Add a slight bounce effect
            counterDisplay.style.transform = 'scale(1.2)';
            setTimeout(() => counterDisplay.style.transform = 'scale(1)', 100);
        });

        // --- To-Do List Logic ---
        const todoInput = document.getElementById('todoInput');
        const addTodoBtn = document.getElementById('addTodoBtn');
        const todoList = document.getElementById('todoList');

        function addTodo() {
            const taskText = todoInput.value.trim();
            if (taskText === '') return;

            const li = document.createElement('li');
            li.className = 'todo-item';
            
            const span = document.createElement('span');
            span.textContent = taskText;
            
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'X';
            deleteBtn.className = 'delete-btn';
            deleteBtn.onclick = () => li.remove();

            li.appendChild(span);
            li.appendChild(deleteBtn);
            todoList.appendChild(li);
            
            todoInput.value = '';
        }

        addTodoBtn.addEventListener('click', addTodo);
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        // --- Canvas Particles Logic ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        
        // Resize canvas correctly
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const mouse = { x: null, y: null };

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            
            // Generate a particle on move
            if(particles.length < 50) {
                particles.push(new Particle(mouse.x, mouse.y));
            }
        });

        canvas.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 5 + 2;
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
                this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.1) this.size -= 0.05;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                if (particles[i].size <= 0.1) {
                    particles.splice(i, 1);
                    i--;
                }
            }

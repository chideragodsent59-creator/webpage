<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dashboard</title>
    <style>
        :root {
            --bg-color: #05050a;
            --card-bg: rgba(15, 15, 35, 0.7);
            --border-neon: #00f0ff;
            --text-neon: #ff007f;
            --text-color: #e2e8f0;
            --glow-shadow: 0 0 10px rgba(0, 240, 255, 0.5), 0 0 20px rgba(0, 240, 255, 0.2);
            --pink-glow: 0 0 10px rgba(255, 0, 127, 0.5), 0 0 20px rgba(255, 0, 127, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
            position: relative;
        }

        /* Fixed Background Canvas for Floating Neon Particles */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(135deg, #050510 0%, #020205 100%);
        }

        header {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--border-neon), 0 0 20px var(--border-neon), 0 0 40px var(--border-neon);
            animation: pulse 2s infinite alternate;
        }

        .dashboard {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 650px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-neon);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(8px);
            box-shadow: var(--glow-shadow), inset 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .card:nth-child(2) {
            border-color: var(--text-neon);
            box-shadow: var(--pink-glow), inset 0 0 15px rgba(255, 0, 127, 0.1);
        }

        .card h2 {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 8px currentColor;
        }

        .card:nth-child(1) h2 { color: var(--border-neon); }
        .card:nth-child(2) h2 { color: var(--text-neon); }

        /* Neon Click Counter */
        .counter-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .counter-display {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            color: #fff;
            text-shadow: 0 0 10px var(--border-neon), 0 0 25px var(--border-neon);
            transition: transform 0.1s ease;
        }

        /* Interactive Buttons */
        button {
            cursor: pointer;
            background: transparent;
            color: #fff;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-cyan {
            border: 2px solid var(--border-neon);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .btn-cyan:hover {
            background: var(--border-neon);
            box-shadow: 0 0 20px var(--border-neon);
            color: #000;
        }

        .btn-pink {
            border: 2px solid var(--text-neon);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .btn-pink:hover {
            background: var(--text-neon);
            box-shadow: 0 0 20px var(--text-neon);
            color: #000;
        }

        /* Neon Task Tracker */
        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--text-neon);
            border-radius: 8px;
            padding: 0.8rem;
            color: #fff;
            font-family: inherit;
        }

        input[type="text"]:focus {
            outline: none;
            box-shadow: 0 0 10px var(--text-neon);
        }

        .todo-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0.8rem;
            background: rgba(255, 0, 127, 0.05);
            border-left: 3px solid var(--text-neon);
            margin-bottom: 0.6rem;
            border-radius: 4px;
        }

        .delete-btn {
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 0.2rem 0.5rem;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background: #ff4444;
            color: #000;
            box-shadow: 0 0 10px #ff4444;
        }

        @keyframes pulse {
            from { text-shadow: 0 0 10px var(--border-neon), 0 0 20px var(--border-neon); }
            to { text-shadow: 0 0 10px var(--border-neon), 0 0 25px var(--border-neon), 0 0 35px var(--border-neon); }
        }
    </style>
</head>
<body>

    <!-- Dynamic Canvas covering the entire background -->
    <canvas id="bgCanvas"></canvas>

    <header>
        <h1>Neon Terminal</h1>
    </header>

    <div class="dashboard">
        <!-- Neon Interactive Click Counter -->
        <div class="card counter-section">
            <h2>Pulse Engine</h2>
            <div class="counter-display" id="counter">0</div>
            <button class="btn-cyan" id="countBtn">Charge Core</button>
        </div>

        <!-- Neon Interactive To-Do List -->
        <div class="card">
            <h2>System Protocols</h2>
            <div class="input-group">
                <input type="text" id="todoInput" placeholder="Initialize script...">
                <button class="btn-pink" id="addTodoBtn">Load</button>
            </div>
            <ul class="todo-list" id="todoList"></ul>
        </div>
    </div>

    <script>
        // --- Click Counter Logic ---
        const counterDisplay = document.getElementById('counter');
        const countBtn = document.getElementById('countBtn');
        let count = 0;
        
        countBtn.addEventListener('click', () => {
            count++;
            counterDisplay.textContent = count;
            counterDisplay.style.transform = 'scale(1.2)';
            setTimeout(() => counterDisplay.style.transform = 'scale(1)', 100);
        });

        // --- To-Do List Logic ---
        const todoInput = document.getElementById('todoInput');
        const addTodoBtn = document.getElementById('addTodoBtn');
        const todoList = document.getElementById('todoList');

        function addTodo() {
            const taskText = todoInput.value.trim();
            if (taskText === '') return;

            const li = document.createElement('li');
            li.className = 'todo-item';
            
            const span = document.createElement('span');
            span.textContent = `> ${taskText}`;
            
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'DEL';
            deleteBtn.className = 'delete-btn';
            deleteBtn.onclick = () => li.remove();

            li.appendChild(span);
            li.appendChild(deleteBtn);
            todoList.appendChild(li);
            
            todoInput.value = '';
        }

        addTodoBtn.addEventListener('click', addTodo);
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        // --- Full Background Neon Particles Animation ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        
        let ArrayParticles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class BackgroundParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                // Alternate between Neon Cyan and Neon Pink
                this.color = Math.random() > 0.5 ? '#00f0ff' : '#ff007f';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Wrap around edges
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
